{% extends "base.html" %}
{% load static %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<section class="ot-login" aria-labelledby="titulo-login">
    <div class="ot-login-brand">
        <img src="{% static 'img/organiza-te.svg' %}" width="96" height="96" alt="">
        <strong>organiza-te</strong>
    </div>
    <div class="ot-login-form">
        <h1 class="h3 mb-4" id="titulo-login">Iniciar sesión</h1>
        {% if form.errors %}<div class="alert alert-danger" role="alert">Revisa tu usuario y contraseña.</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <div class="mb-3">
                <label class="form-label" for="{{ form.username.id_for_label }}">Usuario</label>
                <input class="form-control" type="text" name="username" autofocus required value="{{ form.username.value|default_if_none:'' }}"
                       id="{{ form.username.id_for_label }}" autocomplete="username">
            </div>
            <div class="mb-4">
                <label class="form-label" for="{{ form.password.id_for_label }}">Contraseña</label>
                <div class="input-group">
                    <input class="form-control" type="password" name="password" required id="{{ form.password.id_for_label }}" autocomplete="current-password">
                    <button class="btn btn-outline-secondary toggle-password" data-target="{{ form.password.id_for_label }}" type="button" aria-label="Mostrar contraseña" title="Mostrar contraseña"><i class="bi bi-eye" aria-hidden="true"></i></button>
                </div>
            </div>
            <button class="btn btn-primary w-100" type="submit">Entrar</button>
        </form>
        <p class="mt-3 mb-0">¿No tienes cuenta? <a href="{% url 'usuarios:registro' %}">Regístrate</a></p>
    </div>
</section>
{% endblock %}
