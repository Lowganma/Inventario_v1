{% extends "base.html" %}

{% block title %}
Caja
{% endblock %}

{% block content %}

<div
    class="
        d-flex
        flex-column
        flex-md-row
        justify-content-between
        align-items-md-center
        gap-3
        mb-4
    "
>

    <div>

        <h1 class="page-title mb-1">
            Caja
        </h1>

        <p class="page-subtitle mb-0">
            Control de entradas y salidas de dinero.
        </p>

    </div>


    <div class="d-flex gap-2">

        <a
            href="{% url 'caja:movimientos' %}"
            class="btn btn-outline-primary"
        >
            <i class="bi bi-list-ul me-2"></i>
            Movimientos
        </a>

        <a
            href="{% url 'caja:crear_movimiento' %}"
            class="btn btn-primary"
        >
            <i class="bi bi-plus-circle me-2"></i>
            Nuevo movimiento
        </a>

    </div>

</div>

<div class="row g-3 mt-3">

    <div class="col-12 col-md-4">

        <div class="card content-card">

            <div class="card-body">

                <p class="text-muted mb-1">
                    Ingresos
                </p>

                <h2>
                    ${{ ingresos|floatformat:2 }}
                </h2>

            </div>

        </div>

    </div>


    <div class="col-12 col-md-4">

        <div class="card content-card">

            <div class="card-body">

                <p class="text-muted mb-1">
                    Egresos
                </p>

                <h2>
                    ${{ egresos|floatformat:2 }}
                </h2>

            </div>

        </div>

    </div>


    <div class="col-12 col-md-4">

        <div class="card content-card">

            <div class="card-body">

                <p class="text-muted mb-1">
                    Saldo
                </p>

                <h2>
                    ${{ saldo|floatformat:2 }}
                </h2>

            </div>

        </div>

    </div>

</div>

{% endblock %}
